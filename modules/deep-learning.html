<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An intuitive, interactive guide to the deep learning process in simple English.">
  <title>Deep Learning</title>
  <script>
    const academyReferrer = document.referrer;
    if (!academyReferrer || !new URL(academyReferrer).pathname.startsWith("/StatML-Academy/")) {
      location.replace("../index.html#deep-learning");
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;650;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-geist-sans: "Geist";
      --font-geist-mono: "Geist Mono";
    }


:root {
  --paper: #f7f6f1;
  --paper-2: #efede6;
  --surface: #ffffff;
  --ink: #1f2937;
  --ink-2: #4b5563;
  --muted: #6b7280;
  --border: #dedbd4;
  --indigo: #5b5bd6;
  --deep: #3838a8;
  --coral: #d95f55;
  --amber: #d58b28;
  --green: #3e9a63;
  --blue: #2878d0;
  --shadow: 0 28px 80px rgba(34, 40, 65, 0.09);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  background: var(--paper);
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-geist-sans), Inter, ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font: inherit;
}

button,
a,
summary,
input {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
  text-decoration: none;
}

button:focus-visible,
a:focus-visible,
summary:focus-visible,
input:focus-visible {
  outline: 3px solid rgba(91, 91, 214, 0.38);
  outline-offset: 4px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.module-progress {
  position: fixed;
  z-index: 1200;
  inset: 0 0 auto;
  height: 4px;
  background: rgba(222, 219, 212, 0.55);
}

.module-progress span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--indigo), #818cf8, var(--blue));
  box-shadow: 0 0 12px rgba(91, 91, 214, 0.28);
  transition: width 500ms cubic-bezier(0.22, 1, 0.36, 1);
}

.topbar {
  position: fixed;
  z-index: 1100;
  inset: 4px 0 auto;
  height: 54px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  background: rgba(247, 246, 241, 0.84);
  border-bottom: 1px solid rgba(222, 219, 212, 0.78);
  backdrop-filter: blur(14px);
}

.brand {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  gap: 10px;
  color: var(--ink);
  font-size: 0.84rem;
  line-height: 1;
  font-weight: 650;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.brand-mark {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(91, 91, 214, 0.28);
  border-radius: 7px;
  background: rgba(255, 255, 255, 0.92);
  color: var(--indigo);
  box-shadow: 0 2px 8px rgba(31, 41, 55, 0.06);
  font: 700 0.72rem var(--font-geist-mono), monospace;
}

.nav-topic {
  min-width: 0;
  flex: 1 1 auto;
  overflow: hidden;
  color: var(--ink-2);
  font-size: 0.79rem;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.nav-meta {
  flex: 0 0 auto;
  color: var(--muted);
  font: 600 0.68rem var(--font-geist-mono), monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
}

.hero {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
  display: grid;
  align-items: center;
  padding: 120px max(7vw, 64px) 100px;
  border-bottom: 1px solid var(--border);
  isolation: isolate;
}

.hero::before {
  content: "";
  position: absolute;
  width: 78vw;
  height: 78vw;
  right: -35vw;
  top: -27vw;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 68%, rgba(91, 91, 214, 0.2), transparent 52%);
  z-index: -2;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(31, 41, 55, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(31, 41, 55, 0.035) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: linear-gradient(to right, black, transparent 78%);
  z-index: -3;
}

.hero-copy {
  width: min(860px, 80vw);
  position: relative;
  z-index: 2;
}

.eyebrow {
  margin: 0 0 22px;
  font-family: var(--font-geist-mono), monospace;
  font-size: 11px !important;
  font-weight: 650;
  letter-spacing: 0.14em;
  line-height: 1.4 !important;
  text-transform: uppercase;
  color: var(--indigo);
}

.hero h1 {
  margin: 0;
  max-width: 930px;
  font-size: clamp(60px, 8.2vw, 126px);
  line-height: 0.88;
  letter-spacing: -0.072em;
  font-weight: 620;
}

.hero h1 em {
  color: var(--indigo);
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
}

.lede {
  max-width: 660px;
  margin: 40px 0 0;
  color: var(--ink-2);
  font-size: clamp(18px, 1.55vw, 23px);
  line-height: 1.55;
  letter-spacing: -0.02em;
}

.hero-meta {
  margin-top: 42px;
  display: flex;
  flex-wrap: wrap;
  gap: 13px 28px;
  font-family: var(--font-geist-mono), monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.hero-meta span::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin: 0 9px 1px 0;
  border-radius: 50%;
  background: var(--indigo);
}

.hero-orbit {
  position: absolute;
  right: 5vw;
  top: 24%;
  width: 27vw;
  aspect-ratio: 1;
  border: 1px solid rgba(91, 91, 214, 0.2);
  border-radius: 50%;
  transform: rotate(-18deg);
}

.orbit-two {
  width: 18vw;
  right: 9.5vw;
  top: 31.5%;
  border-color: rgba(217, 95, 85, 0.2);
}

.hero-signal {
  position: absolute;
  right: 4vw;
  top: 19%;
  width: 30vw;
  height: 48%;
  z-index: 1;
}

.hero-signal::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 8%;
  bottom: 8%;
  width: 1px;
  background: linear-gradient(transparent, var(--indigo), var(--coral), transparent);
  transform: rotate(24deg);
}

.hero-signal span {
  --angle: calc(var(--i) * 83deg);
  position: absolute;
  left: calc(42% + cos(var(--angle)) * 36%);
  top: calc(46% + sin(var(--angle)) * 36%);
  padding: 9px 13px;
  border: 1px solid rgba(91, 91, 214, 0.22);
  background: rgba(255, 255, 255, 0.62);
  color: var(--ink-2);
  font: 600 10px var(--font-geist-mono), monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  backdrop-filter: blur(10px);
  animation: breathe 5s ease-in-out infinite;
  animation-delay: calc(var(--i) * -1.1s);
}

.scroll-cue {
  position: absolute;
  right: max(7vw, 64px);
  bottom: 55px;
  display: flex;
  align-items: center;
  gap: 14px;
  color: var(--ink-2);
  font: 600 10px var(--font-geist-mono), monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.scroll-line {
  width: 66px;
  height: 1px;
  background: var(--ink);
  position: relative;
  overflow: hidden;
}

.scroll-line::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--indigo);
  transform: translateX(-100%);
  animation: sweep 2.4s ease-in-out infinite;
}

.premise {
  padding: 150px max(8vw, 70px);
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.6fr);
  gap: 72px 9vw;
  background: var(--ink);
  color: #fff;
}

.premise .eyebrow {
  grid-column: 1 / -1;
  margin-bottom: -30px;
  color: #a7a7ff;
}

.premise h2 {
  margin: 0;
  max-width: 940px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(38px, 5vw, 76px);
  line-height: 1.05;
  font-weight: 400;
  letter-spacing: -0.045em;
}

.premise-copy {
  align-self: end;
  display: grid;
  gap: 18px;
}

.premise-copy p {
  margin: 0;
  color: #c8cdd6;
  font-size: 16px;
  line-height: 1.7;
}

.premise-copy strong {
  color: #fff;
}

.nesting {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1fr 0.74fr 0.47fr;
  align-items: center;
  height: 168px;
  margin-top: 35px;
  border: 1px solid rgba(255, 255, 255, 0.12);
}

.nesting span {
  height: 100%;
  display: grid;
  place-items: center;
  border-right: 1px solid rgba(255, 255, 255, 0.12);
  color: #aeb5c2;
  font: 600 11px var(--font-geist-mono), monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.nesting span:nth-child(2) {
  background: rgba(91, 91, 214, 0.18);
  color: #d6d6ff;
}

.nesting span:last-child {
  border: 0;
  background: var(--indigo);
  color: #fff;
}

.story-shell {
  width: min(1400px, 100%);
  margin: 0 auto;
  padding: 0;
  display: grid;
  grid-template-columns: minmax(340px, 45%) minmax(520px, 55%);
  grid-template-areas: "narrative visual";
  gap: 0;
  align-items: start;
  border-bottom: 1px solid var(--border);
}

.narrative {
  grid-area: narrative;
  padding: 0 4rem 10vh;
}

.lesson-step {
  position: relative;
  min-height: 132vh;
  padding: 170px 0 145px 55px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  scroll-margin-top: 100px;
}

.lesson-step::before {
  content: "";
  position: absolute;
  left: 10px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}

.step-number {
  position: absolute;
  left: 0;
  top: 50%;
  transform: translate(-38%, -50%) rotate(-90deg);
  padding: 12px;
  background: var(--paper);
  color: var(--indigo);
  font: 600 10px var(--font-geist-mono), monospace;
  letter-spacing: 0.16em;
}

.lesson-step h2 {
  margin: 0 0 28px;
  max-width: 620px;
  font-size: clamp(39px, 4.4vw, 69px);
  line-height: 0.98;
  letter-spacing: -0.055em;
  font-weight: 620;
}

.chapter-intro {
  margin: 0;
  max-width: 610px;
  font-size: 19px;
  line-height: 1.7;
  color: var(--ink-2);
}

.why-block,
.how-block {
  width: min(100%, 590px);
  margin-top: 34px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.why-block > span,
.how-block > span {
  display: block;
  margin-bottom: 12px;
  color: var(--indigo);
  font: 650 10px var(--font-geist-mono), monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.why-block p {
  margin: 0;
  color: var(--ink-2);
  font-size: 16px;
  line-height: 1.7;
}

.how-block ol {
  margin: 0;
  padding: 0;
  display: grid;
  list-style: none;
}

.how-block li {
  min-height: 62px;
  padding: 13px 0;
  display: grid;
  grid-template-columns: 31px minmax(0, 1fr);
  gap: 13px;
  align-items: start;
  border-bottom: 1px solid var(--border);
}

.how-block li:last-child {
  border-bottom: 0;
}

.how-block i {
  width: 25px;
  height: 25px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(91, 91, 214, 0.38);
  border-radius: 50%;
  color: var(--indigo);
  font: 650 9px var(--font-geist-mono), monospace;
  font-style: normal;
}

.how-block li p {
  margin: 1px 0 0;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.6;
}

.mental-model {
  width: min(100%, 590px);
  margin: 30px 0 0;
  padding: 20px 22px;
  background: var(--paper-2);
  color: var(--ink-2);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
  line-height: 1.55;
}

.mental-model strong {
  color: var(--ink);
}

.margin-note {
  margin: 24px 0 0;
  max-width: 570px;
  padding-left: 18px;
  border-left: 3px solid var(--indigo);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.65;
}

.visual-stage {
  grid-area: visual;
  position: sticky;
  top: 72px;
  height: calc(100vh - 92px);
  min-height: 560px;
  margin: 72px 1.6rem 20px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
  border: 1px solid rgba(215, 214, 208, 0.9);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: 0 14px 34px rgba(15, 23, 42, 0.07);
}

.stage-header {
  min-height: 82px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.92);
}

.stage-header p {
  margin: 0 0 5px;
  color: var(--indigo);
  font: 650 9px var(--font-geist-mono), monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.stage-header h2 {
  margin: 0;
  font-size: 17px;
  line-height: 1.2;
  letter-spacing: -0.025em;
}

.chapter-dots {
  max-width: 230px;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 7px;
}

.chapter-dots button {
  width: 18px;
  height: 18px;
  padding: 0;
  display: grid;
  place-items: center;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.chapter-dots button::after {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #c8c5bd;
  transition: transform 180ms ease, background 180ms ease;
}

.chapter-dots button.is-active::after {
  background: var(--indigo);
  transform: scale(1.85);
}

.canvas-wrap {
  min-height: 0;
  background: var(--paper);
  position: relative;
  isolation: isolate;
}

.canvas-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow:
    inset 0 18px 30px rgba(31, 41, 55, 0.025),
    inset 0 -18px 30px rgba(31, 41, 55, 0.025);
}

.canvas-wrap canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.visual-caption {
  min-height: 126px;
  margin: 0;
  padding: 15px 24px 17px 30px;
  display: grid;
  grid-template-columns: 82px minmax(0, 1fr);
  align-items: start;
  gap: 8px 17px;
  border-top: 1px solid var(--border);
  background: #fff;
  color: var(--ink-2);
}

.visual-caption p {
  margin: 0;
  font-size: 11px;
  line-height: 1.55;
}

.visual-caption-label {
  padding-top: 2px;
  color: var(--indigo);
  font: 700 8px/1.4 var(--font-geist-mono), monospace;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}

.stage-keys {
  grid-column: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 6px 15px;
}

.stage-keys span {
  position: relative;
  padding-left: 10px;
  color: var(--muted);
  font: 650 8px/1.25 var(--font-geist-mono), monospace;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.stage-keys span::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.35em;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--indigo);
}

.micro-example,
.control-panel,
.segmented-control,
.sliders,
.control-stack,
.epoch-control,
.architecture-tabs,
.threshold-control,
.release-checklist {
  width: min(100%, 570px);
  margin-top: 34px;
}

.micro-example {
  padding: 23px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
}

.micro-example > p {
  margin: 0 0 16px;
  color: var(--muted);
  font: 600 10px var(--font-geist-mono), monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.micro-example > div {
  display: grid;
  grid-template-columns: 64px 1fr 45px;
  align-items: center;
  gap: 10px;
  min-height: 29px;
  font-size: 12px;
}

.micro-example b {
  display: block;
  height: 7px;
  min-width: 4px;
  border-radius: 8px;
  background: #bab7d9;
}

.micro-example b.winner {
  background: var(--indigo);
}

.micro-example code {
  color: var(--muted);
  font-size: 11px;
}

.control-panel {
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  border: 1px solid var(--border);
  background: var(--surface);
}

.control-label,
.range-row > span,
.epoch-control > span:first-child,
.threshold-control > span:first-child,
.sliders label > span {
  display: block;
  margin-bottom: 8px;
  color: var(--muted);
  font: 600 10px var(--font-geist-mono), monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.control-panel strong {
  display: block;
  font-size: 13px;
}

.toggle-button,
.segmented-control button,
.architecture-tabs button {
  min-height: 44px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: background 160ms ease, color 160ms ease, border 160ms ease;
}

.toggle-button {
  padding: 0 15px;
}

.toggle-button:hover,
.toggle-button[aria-pressed="true"],
.segmented-control button[aria-pressed="true"],
.architecture-tabs button[aria-pressed="true"] {
  border-color: var(--indigo);
  background: var(--indigo);
  color: #fff;
}

.split-key {
  width: min(100%, 570px);
  margin-top: 34px;
  display: flex;
  gap: 2px;
}

.split-key span {
  min-width: 76px;
  padding: 15px 12px;
  background: #e8e8ff;
  color: var(--deep);
  font: 650 13px var(--font-geist-mono), monospace;
}

.split-key span:nth-child(2) {
  background: #fff0d6;
  color: #8b5d16;
}

.split-key span:last-child {
  background: #e1f3e7;
  color: #276d43;
}

.split-key small {
  display: block;
  margin-top: 4px;
  font-size: 8px;
  text-transform: uppercase;
}

.segmented-control {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}

.segmented-control button:not(:last-child) {
  border-right: 0;
}

.sliders {
  padding: 21px 24px;
  display: grid;
  gap: 22px;
  border: 1px solid var(--border);
  background: var(--surface);
}

.sliders label > span,
.range-row > span,
.epoch-control > span:first-child,
.threshold-control > span:first-child {
  display: flex;
  justify-content: space-between;
}

output {
  color: var(--indigo);
  font-weight: 700;
}

input[type="range"] {
  width: 100%;
  height: 4px;
  margin: 7px 0;
  accent-color: var(--indigo);
  cursor: pointer;
}

.control-stack {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 16px;
}

.primary-button {
  min-height: 48px;
  padding: 0 19px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  border: 0;
  background: var(--ink);
  color: #fff;
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
  transition: background 160ms ease, transform 160ms ease;
}

.primary-button:hover {
  background: var(--indigo);
  transform: translateY(-2px);
}

.range-row {
  padding: 13px 15px;
  border: 1px solid var(--border);
  background: var(--surface);
}

.range-row > span {
  margin-bottom: 6px;
}

.epoch-control,
.threshold-control {
  padding: 20px 22px;
  display: block;
  border: 1px solid var(--border);
  background: var(--surface);
}

.range-labels {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font: 600 9px var(--font-geist-mono), monospace;
  text-transform: uppercase;
}

.range-labels i {
  font-style: normal;
}

.architecture-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.architecture-tabs button {
  padding: 12px 10px;
}

.architecture-tabs span,
.architecture-tabs small {
  display: block;
}

.architecture-tabs span {
  font: 650 11px var(--font-geist-mono), monospace;
}

.architecture-tabs small {
  margin-top: 4px;
  color: var(--muted);
  font-size: 9px;
}

.architecture-tabs button[aria-pressed="true"] small {
  color: #dadaff;
}

.architecture-control {
  width: min(100%, 570px);
  margin-top: 34px;
}

.tensor-control {
  width: min(100%, 570px);
  margin-top: 34px;
}

.tensor-control .segmented-control {
  width: 100%;
  margin-top: 0;
}

.architecture-control .architecture-tabs {
  width: 100%;
  margin-top: 0;
}

.architecture-explainer,
.concept-explainer {
  margin-top: 14px;
  padding: 22px 24px;
  border-left: 3px solid var(--indigo);
  background: var(--surface);
}

.architecture-explainer > span,
.concept-explainer > span {
  display: block;
  margin-bottom: 13px;
  color: var(--indigo);
  font: 700 10px var(--font-geist-mono), monospace;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.architecture-explainer ol,
.concept-explainer ol {
  margin: 0;
  padding: 0;
  display: grid;
  list-style: none;
}

.architecture-explainer li,
.concept-explainer li {
  padding: 10px 0;
  display: grid;
  grid-template-columns: 25px minmax(0, 1fr);
  gap: 11px;
  border-bottom: 1px solid var(--border);
}

.architecture-explainer li i,
.concept-explainer li i {
  width: 21px;
  height: 21px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(91, 91, 214, 0.38);
  border-radius: 50%;
  color: var(--indigo);
  font: 650 8px var(--font-geist-mono), monospace;
  font-style: normal;
}

.architecture-explainer li p,
.architecture-explainer > p,
.concept-explainer li p,
.concept-explainer > p {
  margin: 0;
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.55;
}

.architecture-explainer > p,
.concept-explainer > p {
  margin-top: 15px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;
}

.architecture-explainer > p strong,
.concept-explainer > p strong {
  color: var(--ink);
}

.architecture-explainer .choice-note {
  padding-top: 15px;
  border-top: 1px solid var(--border);
  font-family: inherit;
  font-size: 13px;
}

.release-checklist {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.release-checklist span {
  position: relative;
  padding: 13px 10px 13px 27px;
  border-bottom: 1px solid var(--border);
  color: var(--ink-2);
  font: 600 10px var(--font-geist-mono), monospace;
  text-transform: uppercase;
}

.release-checklist span::before {
  content: "✓";
  position: absolute;
  left: 5px;
  color: var(--green);
}

.release-checklist span:nth-last-child(-n + 2) {
  border-bottom: 0;
}

blockquote {
  width: min(100%, 570px);
  margin: 34px 0 0;
  padding: 25px 27px;
  background: var(--ink);
  color: #fff;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 22px;
  line-height: 1.35;
}

.section-heading h2 {
  margin: 0;
  font-size: clamp(42px, 5.4vw, 82px);
  line-height: 0.98;
  letter-spacing: -0.06em;
  font-weight: 620;
}

.section-heading > p:last-child {
  margin: 22px 0 0;
  max-width: 520px;
  color: var(--ink-2);
  font-size: 17px;
  line-height: 1.65;
}

.field-guide {
  padding: 150px max(8vw, 70px);
  border-bottom: 1px solid var(--border);
}

.section-heading {
  max-width: 900px;
  margin-bottom: 82px;
}

.guide-groups {
  display: grid;
  gap: 75px;
}

.guide-group {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 5vw;
  align-items: start;
}

.guide-group > header {
  padding-top: 18px;
  position: sticky;
  top: 100px;
}

.guide-group > header p {
  margin: 0 0 8px;
  color: var(--indigo);
  font: 650 10px var(--font-geist-mono), monospace;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.guide-group > header h3 {
  margin: 0 0 20px;
  font-size: 27px;
  letter-spacing: -0.04em;
}

.guide-group > header > span {
  color: var(--muted);
  font: 550 10px var(--font-geist-mono), monospace;
  text-transform: uppercase;
}

.guide-group details {
  border-top: 1px solid var(--border);
}

.guide-group details:last-child {
  border-bottom: 1px solid var(--border);
}

.guide-group summary {
  min-height: 75px;
  padding: 0 4px;
  display: grid;
  grid-template-columns: 54px 1fr 24px;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  list-style: none;
}

.guide-group summary::-webkit-details-marker {
  display: none;
}

.guide-group summary span {
  color: var(--muted);
  font: 600 10px var(--font-geist-mono), monospace;
}

.guide-group summary strong {
  font-size: 17px;
}

.guide-group summary i {
  color: var(--indigo);
  font-size: 22px;
  font-style: normal;
  text-align: center;
  transition: transform 180ms ease;
}

.guide-group details[open] summary i {
  transform: rotate(45deg);
}

.guide-group details > p {
  margin: -2px 28px 24px 70px;
  max-width: 700px;
  color: var(--ink-2);
  font-size: 15px;
  line-height: 1.65;
}

.module-footer {
  min-height: 0;
  padding: 2.2rem 1.5rem 2.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--paper-2);
  border-top: 1px solid var(--border);
}

.footer-return {
  color: var(--muted);
  font: 650 0.7rem var(--font-geist-mono), monospace;
  letter-spacing: 0.1em;
  text-align: center;
  text-transform: uppercase;
}

@keyframes sweep {
  50%, 100% { transform: translateX(100%); }
}

@keyframes breathe {
  50% { transform: translateY(-7px); }
}

@media (max-width: 1100px) {
  .hero-copy {
    width: 92%;
  }

  .hero-signal,
  .hero-orbit {
    opacity: 0.48;
  }

  .story-shell {
    grid-template-columns: minmax(320px, 0.45fr) minmax(450px, 0.55fr);
  }

  .narrative {
    padding-inline: 2.75rem;
  }

  .lesson-step {
    min-height: 145vh;
    padding-left: 44px;
  }

  .visual-stage {
    min-height: 540px;
  }

  .chapter-dots {
    max-width: 160px;
  }
}

@media (max-width: 820px) {
  .topbar {
    height: 50px;
    padding: 0 14px;
    gap: 10px;
  }

  .brand {
    font-size: 0.78rem;
  }

  .nav-topic {
    font-size: 0.72rem;
  }

  .nav-meta {
    font-size: 0.6rem;
  }

  .hero {
    min-height: 94svh;
    padding: 104px 28px 94px;
  }

  .hero-copy {
    width: 100%;
  }

  .hero h1 {
    font-size: clamp(55px, 12.7vw, 92px);
  }

  .hero-signal {
    right: -14vw;
    top: 10%;
    width: 52vw;
    opacity: 0.36;
  }

  .hero-orbit {
    width: 52vw;
    right: -12vw;
    top: 18%;
  }

  .orbit-two {
    width: 34vw;
    right: -3vw;
    top: 24%;
  }

  .scroll-cue {
    left: 28px;
    right: auto;
    bottom: 34px;
  }

  .premise {
    padding: 110px 30px;
    grid-template-columns: 1fr;
    gap: 38px;
  }

  .premise .eyebrow,
  .nesting {
    grid-column: auto;
  }

  .premise .eyebrow {
    margin-bottom: 0;
  }

  .nesting {
    grid-template-columns: 1fr;
    height: auto;
  }

  .nesting span {
    min-height: 68px;
    border-right: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .story-shell {
    padding: 0 20px 80px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas:
      "visual"
      "narrative";
    gap: 0;
  }

  .narrative {
    padding: 0;
  }

  .visual-stage {
    top: 62px;
    z-index: 10;
    height: min(54vh, 540px);
    min-height: 390px;
    margin: 62px 0 0;
    box-shadow: 0 18px 55px rgba(34, 40, 65, 0.13);
  }

  .stage-header {
    min-height: 68px;
    padding: 15px 18px;
  }

  .chapter-dots {
    display: none;
  }

  .visual-caption {
    min-height: 104px;
    padding: 11px 18px 13px 23px;
    grid-template-columns: 70px minmax(0, 1fr);
    gap: 7px 13px;
  }

  .visual-caption p {
    font-size: 9px;
    line-height: 1.5;
  }

  .lesson-step {
    min-height: auto;
    padding: 125px 16px 150px 42px;
  }

  .lesson-step h2 {
    font-size: clamp(38px, 8vw, 60px);
  }

  .guide-group {
    grid-template-columns: 1fr;
  }

  .field-guide {
    padding: 110px 30px;
  }

  .guide-group > header {
    position: static;
  }

  .guide-group {
    gap: 24px;
  }

}

@media (max-width: 520px) {
  .brand {
    font-size: 11px;
  }

  .hero {
    padding-inline: 20px;
  }

  .hero h1 {
    font-size: clamp(48px, 15.2vw, 72px);
    line-height: 0.91;
  }

  .lede {
    margin-top: 30px;
    font-size: 16px;
  }

  .hero-meta {
    gap: 9px 15px;
    font-size: 8px;
  }

  .hero-signal span {
    padding: 7px 8px;
    font-size: 7px;
  }

  .nav-meta {
    display: none;
  }

  .premise {
    padding: 90px 22px;
  }

  .premise h2 {
    font-size: 40px;
  }

  .premise-copy p {
    font-size: 16px;
  }

  .story-shell {
    padding-inline: 12px;
  }

  .visual-stage {
    top: 62px;
    height: 56vh;
    min-height: 420px;
    margin-top: 62px;
  }

  .stage-header {
    min-height: 61px;
  }

  .stage-header h2 {
    font-size: 14px;
  }

  .visual-caption {
    min-height: 88px;
    padding: 10px 13px 11px 16px;
    grid-template-columns: 57px minmax(0, 1fr);
    gap: 6px 10px;
  }

  .visual-caption p {
    display: -webkit-box;
    overflow: hidden;
    font-size: 8.5px;
    line-height: 1.45;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 4;
  }

  .visual-caption-label {
    font-size: 7px;
  }

  .stage-keys {
    display: none;
  }

  .lesson-step {
    min-height: auto;
    padding: 110px 10px 135px 34px;
  }

  .lesson-step::before {
    left: 2px;
  }

  .step-number {
    left: -7px;
  }

  .lesson-step h2 {
    font-size: 39px;
  }

  .chapter-intro {
    font-size: 16px;
  }

  .why-block,
  .how-block {
    margin-top: 28px;
    padding-top: 17px;
  }

  .why-block p,
  .how-block li p {
    font-size: 14px;
  }

  .mental-model {
    padding: 18px;
    font-size: 16px;
  }

  .control-panel,
  .control-stack {
    align-items: stretch;
    grid-template-columns: 1fr;
    flex-direction: column;
  }

  .toggle-button {
    width: 100%;
  }

  .split-key span {
    min-width: 0;
    padding: 12px 7px;
    font-size: 10px;
  }

  .architecture-tabs {
    gap: 4px;
  }

  .architecture-tabs button {
    padding-inline: 6px;
  }

  .field-guide {
    padding: 88px 22px;
  }

  .section-heading h2 {
    font-size: 43px;
  }

  .section-heading {
    margin-bottom: 54px;
  }

  .guide-groups {
    gap: 58px;
  }

  .guide-group summary {
    grid-template-columns: 38px 1fr 20px;
  }

  .guide-group details > p {
    margin-left: 50px;
  }

}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

h as \u201Crecognise animals\u201D leaves too many questions unanswered. Should the model find every animal, draw a box around it, or choose one label? Clear boundaries determine the data you need, the output layer you build, and the mistakes you measure.",how:["Write down one realistic input and the exact output you want back.","Name the task: classification, regression, detection, segmentation, sequence prediction, or generation.","Choose success measures that reflect the real cost of mistakes\u2014not simply the easiest score to calculate."],mental:"Imagine writing an exam rubric before teaching the course. The rubric decides what counts as a correct answer.",note:"For our animal example, one image goes in and three probabilities come out. The largest probability becomes the predicted class.",visual:"One image becomes one probability distribution across the allowed classes. The scores add to 100%; the largest score chooses the label, but it does not prove the model is certain or correct.",keys:["input contract","probabilities","success metric"]},{kicker:"Build the evidence",title:"Collect reality, not shortcuts",body:"A dataset is the model\u2019s entire experience of the world. It will use any regular pattern that helps, whether that pattern expresses the true idea or an accidental shortcut.",why:"If every dog is photographed on grass and every cat is photographed on a sofa, \u201Cbackground\u201D becomes an easier clue than \u201Canimal.\u201D The model can score well in the lab and fail immediately in a real home, park, shelter, or veterinary clinic.",how:["Collect variation in lighting, background, angle, distance, appearance, position, and image quality.","Inspect examples by class and source; look for rare classes, duplicate files, broken records, and inconsistent labels.","Ask what unrelated clue could reveal the answer. Then deliberately collect counterexamples that break that shortcut."],mental:"A child shown only red apples may decide that \u201Capple\u201D means \u201Cred.\u201D Variation teaches which features stay true when the scenery changes.",note:"More examples help only when they add useful coverage. Ten thousand copies of the same narrow situation are still narrow data.",visual:"The repeated animal shape should carry the answer while lighting, angle, and background vary. Toggle the shortcut view to see how a background can accidentally become a more reliable clue than the animal.",keys:["coverage","class balance","shortcut risk"]},{kicker:"Protect the experiment",title:"Split before you tune",body:"To know whether a model can handle new cases, some examples must remain outside the learning process. Each split has one job and should not quietly take on another.",why:"When the model\u2014or the people tuning it\u2014repeatedly sees the final test answers, the score stops measuring generalisation. Duplicate images, the same patient in two splits, or future data leaking into the past can create confidence without real ability.",how:["Use training data to update weights and validation data to compare choices, tune settings, and decide when to stop.","Seal the test set until the architecture and meaningful choices are fixed, then use it once for the final estimate.","Keep related people, videos, devices, or time periods together, and learn preprocessing statistics from training data only."],mental:"Training is the textbook, validation is the practice exam, and testing is the sealed final. Copying a question between them breaks the exam.",note:"A 70/15/15 split is only an example. The important idea is separation; the right percentages depend on dataset size and structure.",visual:"The percentages are only an example; the information boundaries are the lesson. Training changes weights, validation guides choices, and the sealed test set judges once after those choices are fixed.",keys:["learn","choose","judge once"]},{kicker:"Translate the world",title:"Turn examples into tensors",body:"A network cannot receive \u201Ca dog,\u201D \u201Ca sentence,\u201D or \u201Ca melody\u201D directly. It receives a tensor: an organised block of numbers whose shape preserves useful structure.",why:"The representation determines what relationships are easy to learn. Images need nearby pixels to stay nearby, text needs token order, and audio needs precise changes through time. Preprocessing is therefore part of the model\u2019s language, not mere housekeeping.",how:["Images become rows and columns of pixel intensities, usually with red, green, and blue channels.","A tokeniser breaks text into reusable pieces\u2014sometimes a whole word, punctuation mark, or word fragment. Each piece receives an integer ID from a fixed vocabulary.","An embedding table replaces each token ID with a learned vector. Audio is sampled into amplitude numbers; a spectrogram then summarises which frequencies are strong in each short time window."],mental:"Think of representation as translation. The language changes from pictures or words to numbers, but the useful grammar\u2014space, order, or time\u2014must survive.",note:"The same resize, tokeniser, vocabulary, sample rate, and normalisation must be used during training and real use. Changing them changes what the numbers mean.",visual:"Switch data types to follow the entire translation. Text moves from characters to token pieces, IDs, and learned vectors. Audio moves from air pressure to regular samples, then into a time\u2013frequency view.",keys:["shape","scale","structure"]},{kicker:"Meet the smallest learner",title:"Inside one neuron",body:"One artificial neuron is a small decision-maker. It combines several signals into one new signal that later neurons can use.",why:"The neuron matters because the whole network is built from this repeatable operation. The complexity comes from learning many useful combinations and stacking them, not from one magical component.",how:["Multiply every input by a weight. A large positive weight strengthens a clue; a negative weight can argue against it.","Add a bias, which shifts how much total evidence is needed before the neuron responds.","Apply an activation such as ReLU. This non-linearity lets layers combine into curved, flexible decision boundaries."],mental:"Picture a sound-mixing desk. Each input has a volume slider, the bias sets the baseline, and the activation decides what signal leaves the desk.",note:"Weights and biases are parameters: numbers learned during training. Move the controls and watch the same evidence produce a different output.",visual:"Line thickness shows influence, not certainty. Weighted clues and the bias meet at \u03A3; ReLU then passes positive evidence onward and clips a negative total to zero.",keys:["weight \xD7 input","+ bias","activation"]},{kicker:"Stack useful transformations",title:"Depth builds features",body:"A deep network turns the same example into a sequence of increasingly useful descriptions. Each layer receives the previous layer\u2019s features and composes them into larger ideas.",why:"Raw pixels are a poor language for \u201Cdog.\u201D Edges are more useful; groups of edges can describe fur or curves; those patterns can form ears, eyes, and snouts. Hierarchy lets the model reuse simple discoveries to build complex ones.",how:["Early layers respond to local changes such as edges, colour transitions, or short sound patterns.","Middle layers combine repeated local clues into textures, shapes, or meaningful phrase fragments.","Later layers gather evidence across a wider area and make features useful for the final task."],mental:"It is like looking through a stack of tracing sheets. Each sheet redraws the scene using the patterns that matter at its level.",note:"The feature names are a helpful simplification, not rules written by a programmer. Training discovers the filters that reduce the loss.",visual:"Follow the same evidence through increasingly useful descriptions. \u201CEdges\u201D, \u201Ctextures\u201D, and \u201Cparts\u201D are an intuitive sketch\u2014the network learns useful features rather than receiving those names from a person.",keys:["local clues","composition","object evidence"]},{kicker:"The correction cycle",title:"How learning happens",body:"Learning is a repeated correction loop. The network guesses, measures how wrong it was, works out which parameters influenced the mistake, and makes a small adjustment.",why:"A loss number alone says only \u201Cthis was wrong.\u201D Backpropagation turns that complaint into useful directions for millions of parameters, allowing each one to change in proportion to its contribution.",how:["Forward propagation moves a batch through the layers and produces predictions.","A loss function compares predictions with the correct answers; backpropagation calculates gradients from output to input.","An optimiser uses those gradients to update the weights. The learning rate controls how large each step is."],mental:"Imagine descending a foggy hill. The gradient tells you which way slopes downward; the learning rate decides whether you take careful steps or dangerous leaps.",note:"One update teaches very little. Useful behaviour emerges from many batches of examples providing many small, partly noisy corrections.",visual:"The moving marker traces one training cycle. The gradient supplies a direction and the learning rate supplies a step size; lower training loss is useful evidence, but validation must still confirm generalisation.",keys:["forward","gradient","update"]},{kicker:"Train with discipline",title:"Learn patterns, not the answer sheet",body:"Training must continue long enough to discover stable patterns, but not so blindly that the model memorises quirks of the training set.",why:"Training loss almost always rewards more training. Validation data asks the more important question: are these improvements useful on examples that did not update the weights?",how:["Train on small batches; one pass through every training example is an epoch. Switch to evaluation mode before validation.","Plot training and validation curves together. High values for both suggest underfitting; a widening gap suggests overfitting.","Use augmentation, weight decay, dropout, a simpler model, or early stopping\u2014and save the best validation checkpoint."],mental:"One coach watches practice; another watches an unseen match. If practice keeps improving while match performance worsens, the player is learning the drill rather than the game.",note:"Hyperparameters such as learning rate, batch size, depth, and dropout are chosen with validation evidence. They are not learned like ordinary weights.",visual:"Training loss can keep falling after validation loss turns upward. The best checkpoint is chosen where validation is strongest\u2014not at the final epoch and never by looking at the test set.",keys:["batch","epoch","generalisation gap"]},{kicker:"Match shape to problem",title:"Choose an architecture",body:"An architecture is a set of useful assumptions about how information is organised. The right design makes important patterns easier and cheaper to learn.",why:"Images contain many local patterns, not one universal feature. Sequences need memory or direct links across time. Architecture decides how information is shared, how far context can travel, and what the model can compute efficiently.",how:["A CNN layer learns many filters. Every filter scans every image, producing its own feature map. Training changes the filter values; testing reuses the learned filters without inventing new ones.","An RNN reads one item at a time and updates a hidden state\u2014a fixed-length vector that compresses what it has seen. That state can produce scores for the next word or another sequence output.","A Transformer creates a query, key, and value for every token. Query\u2013key matches become attention weights, which gather useful values into context. Training rewards links that help reduce prediction error."],mental:"Choose a tool shaped like the material: a movable stencil for space, a notebook passed through time, or a web of spotlights for attention.",note:"Choose with evidence, not fashion. CNNs remain natural for spatial data. RNNs can suit compact streaming systems. Transformers usually handle long context and parallel training better, but standard attention can require much more memory as a sequence grows.",visual:"Switch mechanisms to compare many reusable filters, a carried numerical memory that predicts the next item, and learned attention links. The diagrams distinguish what is learned during training from what is reused during inference.",keys:["space","sequence","attention"]},{kicker:"Reuse useful experience",title:"Start from a pretrained model",body:"Transfer learning starts from a model that has already learned general patterns from a large dataset, then adapts that knowledge to your narrower task.",why:"Training a large network from random weights can require enormous amounts of labelled data and computation. Useful early features\u2014edges, textures, shapes, language patterns\u2014often transfer between related tasks.",how:["Replace the old output head with one that matches the new classes or target.","First freeze the pretrained backbone and train only the new head; this tests the existing features cheaply.","If needed, unfreeze some layers and fine-tune gently with a smaller learning rate so useful knowledge is not destroyed."],mental:"A trained carpenter does not relearn how to measure and cut wood for every new table. They reuse general craft and learn the new design.",note:"Transfer works best when the earlier data and new task share useful structure. A model can also transfer unwanted biases, so evaluation still matters.",visual:"The backbone carries general experience and the new head learns the specific output. Start with the backbone frozen; fine-tune gently only when the source features are relevant but need adaptation.",keys:["backbone","new head","fine-tune gently"]},{kicker:"Earn confidence",title:"Make an honest judgement",body:"Evaluation asks not only \u201Chow often is it right?\u201D but \u201Cwhere, for whom, and with what confidence does it fail?\u201D The final test set estimates performance on genuinely unseen data.",why:"A model can reach 95% accuracy by always predicting the common class in an imbalanced dataset. In medicine, fraud, or safety, one missed positive can matter far more than one false alarm.",how:["Evaluate the selected checkpoint once on the untouched test set and report class-level precision, recall, F1, and support.","Read the confusion matrix and inspect individual errors for bad labels, rare conditions, occlusion, or shortcut patterns.","Check calibration, uncertainty, and subgroup performance. Choose decision thresholds on validation data using real-world costs."],mental:"Accuracy is the final grade; the confusion matrix is the marked paper showing which questions were misunderstood.",note:"Lower thresholds usually find more true positives but create more false alarms. Higher thresholds usually do the opposite.",visual:"Rows are actual classes and columns are predicted classes. Green diagonal cells are correct; coral off-diagonal cells reveal specific confusions. Choose the threshold on validation data, then report the sealed test result.",keys:["confusion","calibration","trade-offs"]},{kicker:"Move beyond the notebook",title:"Ship the whole pipeline",body:"A deployed model is not only a weights file. It is a complete, repeatable route from raw input to a decision that behaves the same way outside the training notebook.",why:"A brilliant model can produce nonsense if the live system resizes differently, swaps class order, forgets normalisation, or leaves dropout active. Most production failures happen at the seams around the network.",how:["Save the architecture, weights, class order, dimensions, normalisation, tokeniser, threshold, software versions, and configuration.","Validate the input, apply the same preprocessing, switch to evaluation mode, disable gradients, predict, and decode the result.","Test the complete pipeline in its target environment for latency, memory, privacy, energy use, throughput, and failure handling."],mental:"Treat deployment like sealing a recipe with its ingredients, measurements, oven settings, and serving rule\u2014not saving only the cake tin.",note:"The same pipeline may run on a phone, API, browser, hospital system, edge device, or cloud GPU. The constraints can change which model is best.",visual:"The moving sample stays inside one versioned chain. The same preparation, evaluation-mode model, class order, and decision rule must travel together; weights alone are not a deployable system.",keys:["same preprocessing","eval mode","operational limits"]}],ps={image:{title:"Image \xB7 position becomes tensor shape",steps:["Resize or crop the image to a known height and width.","Turn each pixel channel into a number, often scaled to a small common range.","Keep the row, column, and colour-channel axes so nearby pixels remain neighbours."],takeaway:"A 224 \xD7 224 \xD7 3 tensor is a numbered colour grid: height, width, and three colour channels."},text:{title:"Text \xB7 pieces become learned coordinates",steps:["The tokeniser follows a fixed vocabulary and splitting rule. Common words may stay whole; rarer words can become reusable fragments such as \u201Csleep\u201D + \u201Cing\u201D.","Each token receives an ID. The ID is only an address\u2014it does not mean that ID 900 is more meaningful than ID 20.","The ID looks up one row in an embedding table. Its embedding dimension is simply the number of learned values in that row, such as 768.","Training changes those values so tokens useful in similar contexts develop useful geometric relationships."],takeaway:"A token ID is a library index; an embedding is the book of learned notes stored at that index."},audio:{title:"Audio \xB7 pressure becomes regular measurements",steps:["A microphone turns changing air pressure into a changing electrical signal.","An analogue-to-digital converter measures its amplitude at evenly spaced moments. The sample rate says how many measurements are taken each second.","Each measurement is rounded to one of the allowed numerical levels, creating a waveform: amplitude through time.","For a spectrogram, short overlapping windows are analysed to estimate how much low, middle, and high frequency energy each window contains."],takeaway:"A waveform records how far the signal moved at each instant; a spectrogram reorganises those samples into what frequencies occurred when."}},Di={cnn:{title:"CNN \xB7 a bank of reusable spatial detectors",steps:["A layer learns many filters\u2014not only one. Early filters may respond to different edges, colours, or textures.","Every learned filter scans every training image and every test image. One filter produces one feature map showing where its pattern responded.","Training adjusts all filter values. At test time those values are frozen and reused; the model does not design a special filter for each new picture.","Later layers combine the stack of feature maps into more complex evidence such as curves, parts, or whole objects."],takeaway:"Picture a case of many reusable stencils. Every stencil is swept across every picture, producing its own map of matches.",choice:"Choose a CNN when locality and spatial reuse matter\u2014images, video frames, grids, or compact vision systems. CNN ideas are also often combined with attention."},rnn:{title:"RNN \xB7 a running memory",steps:["The hidden state is a fixed-length list of numbers. It is a compressed working memory, not a stored sentence or a human-readable summary.","At each step, the same learned update rule combines the new token embedding with the previous hidden state to create the next state.","To predict the next word, an output layer turns the current state into one score per vocabulary token; softmax converts those scores into probabilities.","Basic RNNs can forget distant information. LSTM and GRU variants add gates that help decide what to keep, update, or discard."],takeaway:"Picture a small notebook passed forward. It cannot hold every detail, so each step rewrites a compressed summary before making the next prediction.",choice:"Choose an RNN when input arrives one step at a time, streaming latency matters, sequences are moderate, or memory and model size are tight. Validate it against a Transformer rather than assuming it will be better."},transformer:{title:"Transformer \xB7 relevance on demand",steps:["Each token embedding is multiplied by learned matrices to create a query, key, and value. A query represents what this position is looking for; a key represents what another position can match.","Query\u2013key similarity scores are normalised into attention weights. Larger weights create stronger information links.","The weighted values are mixed into a context-aware representation. Multiple heads and layers can learn different kinds of relationships.","No person labels the links. Prediction loss sends corrections backward, gradually making links useful for the training objective stronger."],takeaway:"Picture every token holding a search request, a sign describing what it offers, and a parcel of information it can send.",choice:"Choose a Transformer when long-range context, large-scale training, or parallel processing matters. For very long sequences or small streaming devices, compare memory, latency, and specialised efficient-attention designs."}};function be(e,t,l,a,n,u){let i=Math.min(u,a/2,n/2);e.beginPath(),e.moveTo(t+i,l),e.arcTo(t+a,l,t+a,l+n,i),e.arcTo(t+a,l+n,t,l+n,i),e.arcTo(t,l+n,t,l,i),e.arcTo(t,l,t+a,l,i),e.closePath()}function zy({active:e,biased:t,tensorMode:l,earWeight:a,furWeight:n,backgroundWeight:u,neuronBias:i,learnStep:f,learningRate:s,epoch:h,architecture:b,threshold:T}){let y=(0,Ce.useRef)(null);return(0,Ce.useEffect)(()=>{let g=y.current;if(!g)return;let c=g.getContext("2d");if(!c
